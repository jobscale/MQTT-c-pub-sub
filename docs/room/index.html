<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.5" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="favicon.png">
  <title>MQTT Over WebSocket</title>
</head>
<body>
  <div id="app">
    <article class="area-background quiet-2" role="img"></article>
    <section>
      <div class="content">
        <div class="group">
          <div>
            <h1>Create a new Room</h1>
          </div>
        </div>
        <form @submit.prevent="onSubmit" class="form">
          <button @click.prevent="onNewRoom" class="fast" title="Refresh">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-ccw preview-icon"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          </button>
          <input ref="input" type="text" v-model="clientId" class="client-id" readonly="true">
          <button type="submit" class="fast" title="Create room">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square-plus preview-icon"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/><path d="M12 8v6"/><path d="M9 11h6"/></svg>
          </button>
        </form>
      </div>
    </section>
    <div ref="full-screen" class="full-screen">{{ message }}</div>
    <footer style="text-align:right;margin:0.5em;"><a href="https://jsx.jp" target="_blank">powered by jsx.jp</a></footer>
  </div>
  <script defer type="module" src="/js/room.js"></script>
</body>
</html>
